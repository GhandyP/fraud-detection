[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "A scikit-learn fraud detection pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.4.1",
    "scikit-learn==1.6.1",
    "joblib==1.3.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.10"
