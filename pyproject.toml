[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "A scikit-learn fraud detection pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.4.1",
    "scikit-learn==1.6.1",
    "scipy>=1.11,<1.16",
    "joblib==1.3.2",
    "pyyaml==6.0.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.scripts]
fraud = "fraud_detection.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Pinned upstream deprecation (fastapi 0.141.1/starlette 1.6.0): the
    # starlette TestClient prefers httpx2, while this project pins httpx 0.28.1.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["fraud_detection"]
branch = true

[tool.coverage.report]
show_missing = true
